<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Düşünmez misiniz?</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="eyebrow">TEFEKKÜR ARACI</div>
        <h1 id="appTitle">Düşünmez misiniz?</h1>
        <p id="subtitle">Bir fotoğraf çek. Gördüğünün ardındaki düzeni düşün.</p>
      </div>
      <select id="language" aria-label="Dil">
        <option value="tr">Türkçe</option>
        <option value="en">English</option>
        <option value="de">Deutsch</option>
      </select>
    </header>

    <section class="card capture-card">
      <label class="upload" for="imageInput">
        <span class="camera">◉</span>
        <strong id="pickLabel">Fotoğraf çek veya seç</strong>
        <small id="pickHint">Kamera, galeri veya dosyalar</small>
      </label>
      <input id="imageInput" type="file" accept="image/*" capture="environment" />
      <img id="preview" alt="Seçilen fotoğraf" hidden />
      <button id="analyzeBtn" disabled>Üzerinde düşün</button>
      <p id="privacy">Fotoğraf yalnızca analiz için güvenli sunucuya gönderilir.</p>
    </section>

    <section id="status" class="status" hidden></section>

    <section id="result" class="results" hidden>
      <article class="card hero-result">
        <span id="resultLabel">GÖRDÜĞÜN</span>
        <h2 id="title"></h2>
        <p id="observation"></p>
      </article>
      <article class="card"><h3 id="scienceLabel">Bilim</h3><p id="science"></p></article>
      <article class="card"><h3 id="reflectionLabel">Tefekkür</h3><p id="reflection"></p></article>
      <article id="quranCard" class="card" hidden><h3 id="quranLabel">Kur’an’dan bir işaret</h3><p id="quranText"></p><strong id="quranReference"></strong></article>
      <article class="card question"><h3 id="question"></h3></article>
      <button id="againBtn" class="secondary">Başka bir fotoğraf seç</button>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
